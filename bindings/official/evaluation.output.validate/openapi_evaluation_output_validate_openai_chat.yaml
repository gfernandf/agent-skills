id: openapi_evaluation_output_validate_openai_chat
capability: evaluation.output.validate
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.output.validate. Capability description: Evaluate whether a final output satisfies the explicit success and acceptance criteria defined for the task. Each criterion is assessed individually and the overall evaluation returns a pass/fail verdict with per-criterion scores, a list of unmet criteria, and concrete improvement suggestions for failed items.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'final_output: ${input.final_output}\n\nsuccess_criteria: ${input.success_criteria}\n\nevidence: ${input.evidence}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  evaluation:
  - response.choices.0.message.content_json.evaluation
  - response.choices.0.message.content_json.validation_result
  - response.choices.0.message.content_json.result
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_output_validate
  description: OpenAI binding for evaluation.output.validate using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30


