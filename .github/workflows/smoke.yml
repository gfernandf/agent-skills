name: Smoke Verification

on:
  push:
    branches:
      - master
      - main
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      run_full_batch:
        description: "Run full capability batch verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

env:
  # Pinned registry ref for deterministic cross-repo smoke runs.
  # Update intentionally when advancing the runtime/registry compatibility baseline.
  REGISTRY_REF: e6a181e
  # Operational guardrail: fail if the pin drifts too far behind origin/main.
  MAX_PIN_DRIFT_COMMITS: 25

jobs:
  pin_drift_guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout agent-skill-registry
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/agent-skill-registry.git" ../agent-skill-registry
          git -C ../agent-skill-registry fetch origin main --quiet
          git -C ../agent-skill-registry rev-parse --verify "${REGISTRY_REF}^{commit}" >/dev/null

      - name: Enforce registry pin drift budget
        run: |
          DRIFT=$(git -C ../agent-skill-registry rev-list --count "${REGISTRY_REF}..origin/main")
          echo "Pinned registry drift commits: ${DRIFT}"
          if [ "${DRIFT}" -gt "${MAX_PIN_DRIFT_COMMITS}" ]; then
            echo "REGISTRY_REF drift (${DRIFT}) exceeds MAX_PIN_DRIFT_COMMITS (${MAX_PIN_DRIFT_COMMITS})." >&2
            echo "Update REGISTRY_REF after validating runtime/registry compatibility." >&2
            exit 1
          fi

  smoke:
    needs: pin_drift_guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout agent-skill-registry
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/agent-skill-registry.git" ../agent-skill-registry
          git -C ../agent-skill-registry checkout "${REGISTRY_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest

      - name: Run smoke verifier
        run: |
          python tooling/verify_smoke_capabilities.py --report-file artifacts/smoke_report.json

      - name: Run customer-facing smoke checks
        run: |
          mkdir -p artifacts
          python tooling/verify_customer_http_controls.py | tee artifacts/customer_http_controls.log
          python tooling/verify_customer_facing_parity_snapshot.py | tee artifacts/customer_parity_snapshot.log
          python tooling/verify_mcp_text_summarize.py | tee artifacts/mcp_text_summarize.log
          python tooling/verify_mcp_data_web_slices.py | tee artifacts/mcp_data_web_slices.log

      - name: Build attach target index and run gateway smoke
        run: |
          python tooling/build_attach_target_index.py --runtime-root . | tee artifacts/attach_target_index.log
          python tooling/smoke_gateway_slice3.py --runtime-root . --registry-root ../agent-skill-registry --host-root . | tee artifacts/gateway_slice3.log

      - name: Publish smoke report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            artifacts/smoke_report.json
            artifacts/customer_http_controls.log
            artifacts/customer_parity_snapshot.log
            artifacts/mcp_text_summarize.log
            artifacts/mcp_data_web_slices.log
            artifacts/attach_target_index.log
            artifacts/gateway_slice3.log
            artifacts/attach_targets/index.json
            tooling/snapshots/consumer_facing_parity_v1.actual.json

      - name: Append smoke summary
        if: always()
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          report_path = Path('artifacts/smoke_report.json')
          if not report_path.exists():
              summary = "## Smoke Verification\n\nNo report file generated.\n"
          else:
              report = json.loads(report_path.read_text(encoding='utf-8'))
              summary = [
                  "## Smoke Verification",
                  "",
                  f"- Total: {report.get('total', 0)}",
                  f"- Passed: {report.get('passed', 0)}",
                  f"- Failed: {report.get('failed', 0)}",
                  "",
              ]
              failures = report.get('failures', [])
              if failures:
                  summary.append("### Failures")
                  for item in failures:
                      summary.append(f"- {item.get('capability')}: {item.get('reason')}")
              else:
                  summary.append("All smoke capabilities passed.")
              summary = "\n".join(summary) + "\n"

          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write(summary)
          PY

      - name: Append customer-facing smoke summary
        if: always()
        run: |
          python - << 'PY'
          from pathlib import Path

          checks = [
              (Path('artifacts/customer_http_controls.log'), 'Customer-facing HTTP controls verification passed.'),
              (Path('artifacts/customer_parity_snapshot.log'), 'Customer-facing parity snapshot verification passed.'),
              (Path('artifacts/mcp_text_summarize.log'), 'MCP text.content.summarize verification passed.'),
              (Path('artifacts/mcp_data_web_slices.log'), 'MCP data/web slice verification passed.'),
              (Path('artifacts/gateway_slice3.log'), '[smoke] slice3 PASSED'),
          ]

          lines = ['## Customer-Facing Smoke Checks', '']
          for log_path, expected in checks:
              if not log_path.exists():
                  lines.append(f'- {log_path.name}: missing log')
                  continue
              content = log_path.read_text(encoding='utf-8', errors='replace')
              status = 'passed' if expected in content else 'failed'
              lines.append(f'- {log_path.name}: {status}')

          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY

  contracts:
    needs: pin_drift_guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout agent-skill-registry
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/agent-skill-registry.git" ../agent-skill-registry
          git -C ../agent-skill-registry checkout "${REGISTRY_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run contract tests
        run: |
          mkdir -p artifacts
          python tooling/test_capability_contracts.py | tee artifacts/contracts.log

      - name: Publish contracts artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-report
          path: artifacts/contracts.log

      - name: Append contracts summary
        if: always()
        run: |
          python - << 'PY'
          from pathlib import Path

          log_path = Path('artifacts/contracts.log')
          if not log_path.exists():
              summary = "## Contract Tests\n\nNo contract log generated.\n"
          else:
              lines = log_path.read_text(encoding='utf-8', errors='replace').splitlines()
              summary_line = next((line for line in lines if line.startswith('SUMMARY:')), None)
              summary = "## Contract Tests\n\n"
              if summary_line:
                  summary += f"- {summary_line}\n"
              else:
                  summary += "- Summary line not found in log.\n"

          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write(summary)
          PY

  registry_consistency:
    needs: pin_drift_guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout agent-skill-registry
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/agent-skill-registry.git" ../agent-skill-registry
          git -C ../agent-skill-registry checkout "${REGISTRY_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Validate registry
        run: |
          cd ../agent-skill-registry
          python tools/validate_registry.py

      - name: Regenerate registry catalog and stats
        run: |
          cd ../agent-skill-registry
          python tools/generate_catalog.py
          python tools/registry_stats.py

      - name: Verify catalog freshness
        run: |
          git -C ../agent-skill-registry status --porcelain
          if [ -n "$(git -C ../agent-skill-registry status --porcelain)" ]; then
            echo "Registry catalog/stats are out of date. Please regenerate and commit changes." >&2
            git -C ../agent-skill-registry --no-pager diff
            exit 1
          fi

      - name: Append registry consistency summary
        if: always()
        run: |
          python - << 'PY'
          import subprocess
          from pathlib import Path

          cp = subprocess.run(
            ["git", "-C", "../agent-skill-registry", "status", "--porcelain"],
            check=False,
            text=True,
            capture_output=True,
          )
          has_diffs = bool((cp.stdout or "").strip())
          freshness = "pending diffs detected" if has_diffs else "no pending diffs"
          summary = (
            "## Registry Consistency\n\n"
            "- Validation: completed\n"
            f"- Catalog freshness: {freshness}\n"
          )
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write(summary)
          PY

  openapi_verification:
    needs: pin_drift_guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout agent-skill-registry
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/agent-skill-registry.git" ../agent-skill-registry
          git -C ../agent-skill-registry checkout "${REGISTRY_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run OpenAPI verifications
        run: |
          mkdir -p artifacts
          python cli/main.py openapi verify-bindings --all --report-file artifacts/openapi_bindings_report.json
          python cli/main.py openapi verify-invoker | tee artifacts/openapi_invoker.log
          python cli/main.py openapi verify-errors | tee artifacts/openapi_errors.log

      - name: Publish OpenAPI verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-verification-report
          path: |
            artifacts/openapi_bindings_report.json
            artifacts/openapi_invoker.log
            artifacts/openapi_errors.log

      - name: Append OpenAPI summary
        if: always()
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          report_path = Path('artifacts/openapi_bindings_report.json')
          summary = [
              "## OpenAPI Verification",
              "",
          ]

          if report_path.exists():
              report = json.loads(report_path.read_text(encoding='utf-8'))
              summary.extend([
                  f"- Scenarios total: {report.get('total', 0)}",
                  f"- Scenarios passed: {report.get('passed', 0)}",
                  f"- Scenarios failed: {report.get('failed', 0)}",
              ])
          else:
              summary.append("- Scenario report file not generated.")

          invoker_log = Path('artifacts/openapi_invoker.log')
          errors_log = Path('artifacts/openapi_errors.log')
          summary.append(f"- Invoker log present: {'yes' if invoker_log.exists() else 'no'}")
          summary.append(f"- Error contract log present: {'yes' if errors_log.exists() else 'no'}")
          summary.append("")

          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write("\n".join(summary) + "\n")
          PY

  runtime_canary:
    needs: pin_drift_guard
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout agent-skill-registry
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/agent-skill-registry.git" ../agent-skill-registry
          git -C ../agent-skill-registry checkout "${REGISTRY_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest
          pip install jsonschema

      - name: Run runtime canary checks
        run: |
          mkdir -p artifacts
          python tooling/verify_binding_fallback_policy.py | tee artifacts/binding_fallback.log
          python tooling/verify_binding_conformance_suite.py | tee artifacts/binding_conformance_suite.log
          python tooling/verify_customer_facing_neutral.py | tee artifacts/customer_facing_neutral.log
          python tooling/verify_durability_contract.py --report-file artifacts/durability_contract_report.json
          python tooling/verify_durability_advanced.py --report-file artifacts/durability_advanced_report.json
          python tooling/verify_replay_determinism.py --report-file artifacts/replay_determinism_report.json --repetitions 2
          python tooling/verify_workflow_version_compatibility.py --report-file artifacts/workflow_version_compatibility_report.json
          python tooling/verify_checkpoint_schema_provenance.py --report-file artifacts/checkpoint_schema_provenance_report.json
          python tooling/verify_provenance_coverage.py --report-file artifacts/provenance_coverage_report.json
          python tooling/verify_policy_shadow_mode.py --report-file artifacts/policy_shadow_report.json
          python tooling/verify_tenant_isolation_matrix.py --report-file artifacts/tenant_isolation_matrix_report.json
          python tooling/verify_policy_bundle_lifecycle.py --bundle-root policies/opa --report-file artifacts/policy_bundle_lifecycle_report.json
          python tooling/compute_runtime_coverage.py > artifacts/runtime_coverage.json
          python tooling/compute_skill_executability.py > artifacts/skill_executability.json

      - name: Enforce coverage and executability ratios
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path('artifacts/runtime_coverage.json').read_text(encoding='utf-8'))
          skills = json.loads(Path('artifacts/skill_executability.json').read_text(encoding='utf-8'))

          coverage_ratio = float(coverage.get('coverage_ratio', 0.0) or 0.0)
          executability_ratio = float(skills.get('executability_ratio', 0.0) or 0.0)

          if coverage_ratio < 1.0:
              raise SystemExit(f"Coverage ratio below 1.0: {coverage_ratio}")
          if executability_ratio < 1.0:
              raise SystemExit(f"Skill executability ratio below 1.0: {executability_ratio}")
          PY

      - name: Generate policy promotion readiness report
        run: |
          python tooling/generate_policy_promotion_readiness.py --manifest-file policies/opa/bundle_manifest.json --artifacts-dir artifacts --report-file artifacts/policy_promotion_readiness_report.json

      - name: Verify policy promotion readiness report
        run: |
          python tooling/verify_policy_promotion_readiness.py --report-file artifacts/policy_promotion_readiness_report.json --verify-report-file artifacts/policy_promotion_readiness_verify_report.json --require-passed --require-dev-to-staging-ready --require-staging-to-prod-automated-ready

      - name: Generate runtime governance executive summary
        if: always()
        run: |
          python tooling/generate_governance_executive_summary.py \
            --title "Governance Executive Summary (Runtime Canary)" \
            --input-report artifacts/durability_contract_report.json \
            --input-report artifacts/durability_advanced_report.json \
            --input-report artifacts/replay_determinism_report.json \
            --input-report artifacts/workflow_version_compatibility_report.json \
            --input-report artifacts/checkpoint_schema_provenance_report.json \
            --input-report artifacts/provenance_coverage_report.json \
            --input-report artifacts/policy_shadow_report.json \
            --input-report artifacts/tenant_isolation_matrix_report.json \
            --input-report artifacts/policy_bundle_lifecycle_report.json \
            --input-report artifacts/policy_promotion_readiness_report.json \
            --input-report artifacts/policy_promotion_readiness_verify_report.json \
            --report-file artifacts/runtime_governance_executive_summary.json \
            --markdown-file artifacts/runtime_governance_executive_summary.md

      - name: Publish runtime canary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-canary-report
          path: |
            artifacts/binding_fallback.log
            artifacts/binding_conformance_suite.log
            artifacts/customer_facing_neutral.log
            artifacts/durability_contract_report.json
            artifacts/durability_advanced_report.json
            artifacts/replay_determinism_report.json
            artifacts/workflow_version_compatibility_report.json
            artifacts/checkpoint_schema_provenance_report.json
            artifacts/provenance_coverage_report.json
            artifacts/policy_shadow_report.json
            artifacts/tenant_isolation_matrix_report.json
            artifacts/policy_bundle_lifecycle_report.json
            artifacts/policy_promotion_readiness_report.json
            artifacts/policy_promotion_readiness_verify_report.json
            artifacts/runtime_governance_executive_summary.json
            artifacts/runtime_governance_executive_summary.md
            artifacts/runtime_coverage.json
            artifacts/skill_executability.json

      - name: Append runtime canary summary
        if: always()
        run: |
          python - << 'PY'
          import json
          import os
          from pathlib import Path

          lines = ['## Runtime Canary', '']

          coverage_path = Path('artifacts/runtime_coverage.json')
          skills_path = Path('artifacts/skill_executability.json')
          durability_path = Path('artifacts/durability_contract_report.json')
          durability_advanced_path = Path('artifacts/durability_advanced_report.json')
          replay_determinism_path = Path('artifacts/replay_determinism_report.json')
          workflow_version_path = Path('artifacts/workflow_version_compatibility_report.json')
          checkpoint_schema_path = Path('artifacts/checkpoint_schema_provenance_report.json')
          provenance_coverage_path = Path('artifacts/provenance_coverage_report.json')
          policy_path = Path('artifacts/policy_shadow_report.json')
          tenant_path = Path('artifacts/tenant_isolation_matrix_report.json')
          bundle_path = Path('artifacts/policy_bundle_lifecycle_report.json')
          promotion_path = Path('artifacts/policy_promotion_readiness_report.json')

          if coverage_path.exists():
              coverage = json.loads(coverage_path.read_text(encoding='utf-8'))
              lines.append(f"- Coverage ratio: {coverage.get('coverage_ratio', 'n/a')}")
          else:
              lines.append('- Coverage ratio: report missing')

          if skills_path.exists():
              skills = json.loads(skills_path.read_text(encoding='utf-8'))
              lines.append(f"- Skill executability ratio: {skills.get('executability_ratio', 'n/a')}")
          else:
              lines.append('- Skill executability ratio: report missing')

          if durability_path.exists():
              durability = json.loads(durability_path.read_text(encoding='utf-8'))
              d_summary = durability.get('summary', {})
              lines.append(
                  f"- Durability contract: {durability.get('status', 'unknown')} "
                  f"({d_summary.get('passed', 'n/a')}/{d_summary.get('total', 'n/a')})"
              )
          else:
              lines.append('- Durability contract: report missing')

          if durability_advanced_path.exists():
              durability_adv = json.loads(durability_advanced_path.read_text(encoding='utf-8'))
              adv_summary = durability_adv.get('summary', {})
              lines.append(
                  f"- Durability advanced: {durability_adv.get('status', 'unknown')} "
                  f"(scenarios={adv_summary.get('passed_scenarios', 'n/a')}/{adv_summary.get('total_scenarios', 'n/a')})"
              )
              lines.append(
                f"- Durability advanced tests: "
                f"{adv_summary.get('passed_tests', 'n/a')}/{adv_summary.get('total_tests', 'n/a')}"
              )
          else:
              lines.append('- Durability advanced: report missing')

          if replay_determinism_path.exists():
              replay_det = json.loads(replay_determinism_path.read_text(encoding='utf-8'))
              det_summary = replay_det.get('summary', {})
              lines.append(
                  f"- Replay determinism: {replay_det.get('status', 'unknown')} "
                  f"(passes={det_summary.get('passed_executions', 'n/a')}/"
                  f"{det_summary.get('completed_executions', 'n/a')})"
              )
          else:
              lines.append('- Replay determinism: report missing')

          if workflow_version_path.exists():
              workflow_version = json.loads(workflow_version_path.read_text(encoding='utf-8'))
              wf_summary = workflow_version.get('summary', {})
              lines.append(
                  f"- Workflow version compatibility: {workflow_version.get('status', 'unknown')} "
                  f"(tests={wf_summary.get('passed_tests', 'n/a')}/"
                  f"{wf_summary.get('total_tests', 'n/a')})"
              )
          else:
              lines.append('- Workflow version compatibility: report missing')

          if checkpoint_schema_path.exists():
              checkpoint_schema = json.loads(checkpoint_schema_path.read_text(encoding='utf-8'))
              cs_summary = checkpoint_schema.get('summary', {})
              lines.append(
                  f"- Checkpoint schema/provenance: {checkpoint_schema.get('status', 'unknown')} "
                  f"(tests={cs_summary.get('passed_tests', 'n/a')}/"
                  f"{cs_summary.get('total_tests', 'n/a')})"
              )
          else:
              lines.append('- Checkpoint schema/provenance: report missing')

          if provenance_coverage_path.exists():
              provenance_coverage = json.loads(provenance_coverage_path.read_text(encoding='utf-8'))
              pc_summary = provenance_coverage.get('summary', {})
              lines.append(
                  f"- Provenance coverage: {provenance_coverage.get('status', 'unknown')} "
                  f"(tests={pc_summary.get('passed_tests', 'n/a')}/"
                  f"{pc_summary.get('total_tests', 'n/a')})"
              )
          else:
              lines.append('- Provenance coverage: report missing')

          if policy_path.exists():
              policy = json.loads(policy_path.read_text(encoding='utf-8'))
              p_summary = policy.get('summary', {})
              lines.append(
                  f"- Policy shadow parity: {policy.get('status', 'unknown')} "
                  f"({p_summary.get('matched', 'n/a')}/{p_summary.get('total', 'n/a')})"
              )
          else:
              lines.append('- Policy shadow parity: report missing')

          if tenant_path.exists():
              tenant = json.loads(tenant_path.read_text(encoding='utf-8'))
              t_summary = tenant.get('summary', {})
              lines.append(
                  f"- Tenant isolation matrix: {tenant.get('status', 'unknown')} "
                  f"({t_summary.get('passed', 'n/a')}/{t_summary.get('total', 'n/a')})"
              )
          else:
              lines.append('- Tenant isolation matrix: report missing')

          if bundle_path.exists():
              bundle = json.loads(bundle_path.read_text(encoding='utf-8'))
              b_summary = bundle.get('summary', {})
              lines.append(
                  f"- Policy bundle lifecycle: {bundle.get('status', 'unknown')} "
                  f"({b_summary.get('passed', 'n/a')}/{b_summary.get('total', 'n/a')})"
              )
          else:
              lines.append('- Policy bundle lifecycle: report missing')

          if promotion_path.exists():
              promotion = json.loads(promotion_path.read_text(encoding='utf-8'))
              p_summary = promotion.get('summary', {})
              envs = promotion.get('environments', {})
              d2s = envs.get('dev_to_staging', {}) if isinstance(envs, dict) else {}
              s2p = envs.get('staging_to_prod', {}) if isinstance(envs, dict) else {}
              lines.append(
                  f"- Policy promotion readiness: {promotion.get('status', 'unknown')} "
                  f"(canary_ratio={p_summary.get('runtime_canary_pass_ratio', 'n/a')})"
              )
              lines.append(
                  f"- Dev→Staging ready: {d2s.get('ready', 'n/a')}"
              )
              lines.append(
                  f"- Staging→Prod automated ready: {s2p.get('automated_ready', 'n/a')} "
                  f"(required_approvals={s2p.get('required_approvals', 'n/a')})"
              )
          else:
              lines.append('- Policy promotion readiness: report missing')

          for log_name in [
              'binding_fallback.log',
              'binding_conformance_suite.log',
              'customer_facing_neutral.log',
          ]:
              log_path = Path('artifacts') / log_name
              lines.append(f"- {log_name}: {'present' if log_path.exists() else 'missing'}")

          with open(Path(os.environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY

  dx_metrics:
    needs: pin_drift_guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DX_SLO_ENFORCE: "false"
      DX_SLO_MAX_TTFS_SECONDS: "300"
      DX_SLO_MIN_DOCS_PARITY: "0.90"
      DX_SLO_MIN_CHECK_PASS_RATIO: "1.00"

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout agent-skill-registry
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/agent-skill-registry.git" ../agent-skill-registry
          git -C ../agent-skill-registry checkout "${REGISTRY_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run DX metrics
        run: |
          mkdir -p artifacts
          python tooling/measure_dx_metrics.py --report-file artifacts/dx_metrics.json

      - name: Evaluate DX SLO and append history
        run: |
          ARGS="--metrics-file artifacts/dx_metrics.json --history-file artifacts/dx_metrics_history.jsonl --slo-report-file artifacts/dx_metrics_slo_report.json"
          ARGS="$ARGS --max-time-to-first-success-seconds ${DX_SLO_MAX_TTFS_SECONDS}"
          ARGS="$ARGS --min-docs-parity-score ${DX_SLO_MIN_DOCS_PARITY}"
          ARGS="$ARGS --min-check-pass-ratio ${DX_SLO_MIN_CHECK_PASS_RATIO}"
          if [ "${DX_SLO_ENFORCE}" = "true" ]; then
            ARGS="$ARGS --fail-on-slo-breach"
          fi
          python tooling/evaluate_dx_metrics.py ${ARGS}

      - name: Publish DX metrics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dx-metrics-report
          path: |
            artifacts/dx_metrics.json
            artifacts/dx_metrics_history.jsonl
            artifacts/dx_metrics_slo_report.json
            artifacts/smoke_report.json

      - name: Append DX metrics summary
        if: always()
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          report_path = Path('artifacts/dx_metrics.json')
          slo_path = Path('artifacts/dx_metrics_slo_report.json')
          lines = ['## DX Metrics', '']

          if not report_path.exists():
              lines.append('- Report missing: artifacts/dx_metrics.json')
          else:
              report = json.loads(report_path.read_text(encoding='utf-8'))
              metrics = report.get('metrics', {})
              lines.append(f"- Status: {report.get('status', 'unknown')}")
              lines.append(
                  f"- Checks passed: {metrics.get('checks_passed', 'n/a')}/{metrics.get('checks_total', 'n/a')}"
              )
              lines.append(
                  f"- Docs parity score: {metrics.get('docs_parity_score', 'n/a')}"
              )
              lines.append(
                  f"- Time to first success (s): {metrics.get('time_to_first_success_seconds', 'n/a')}"
              )

              if not slo_path.exists():
                lines.append('- SLO report: missing')
              else:
                slo = json.loads(slo_path.read_text(encoding='utf-8'))
                lines.append(f"- SLO status: {slo.get('slo_status', 'unknown')}")
                breaches = slo.get('breaches', [])
                if breaches:
                  lines.append('- SLO breaches:')
                  for breach in breaches:
                    lines.append(f"  - {breach}")

          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY

  full_batch:
    needs: pin_drift_guard
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_full_batch == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout agent-skill-registry
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${OWNER}/agent-skill-registry.git" ../agent-skill-registry
          git -C ../agent-skill-registry checkout "${REGISTRY_REF}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run full capability batch
        run: |
          mkdir -p artifacts
          python test_capabilities_batch.py | tee artifacts/full_batch.log

      - name: Publish full-batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-batch-log
          path: artifacts/full_batch.log

      - name: Append full-batch summary
        if: always()
        run: |
          python - << 'PY'
          from pathlib import Path

          log_path = Path('artifacts/full_batch.log')
          if not log_path.exists():
              summary = "## Full Batch Verification\n\nNo full batch log generated.\n"
          else:
              lines = log_path.read_text(encoding='utf-8', errors='replace').splitlines()
              summary_line = next((line for line in lines if line.startswith('SUMMARY:')), None)
              summary = "## Full Batch Verification\n\n"
              if summary_line:
                  summary += f"- {summary_line}\n"
              else:
                  summary += "- Summary line not found in log.\n"

          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write(summary)
          PY

  ci_stability_trend:
    needs:
      - pin_drift_guard
      - smoke
      - runtime_canary
      - dx_metrics
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_TREND_SLO_ENFORCE: "true"
      CI_TREND_SLO_FAIL_ON_UNVERIFIED: "true"
      CI_TREND_SLO_MIN_PASS_RATE: "0.80"
      CI_TREND_SLO_MIN_SAMPLES: "5"

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate critical CI trend report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          python tooling/report_critical_ci_trend.py --report-file artifacts/critical_ci_trend_report.json --window 20

      - name: Evaluate critical CI trend SLO
        run: |
          ARGS="--trend-report-file artifacts/critical_ci_trend_report.json --slo-report-file artifacts/critical_ci_trend_slo_report.json"
          ARGS="$ARGS --min-pass-rate ${CI_TREND_SLO_MIN_PASS_RATE}"
          ARGS="$ARGS --min-samples ${CI_TREND_SLO_MIN_SAMPLES}"
          if [ "${CI_TREND_SLO_ENFORCE}" = "true" ]; then
            ARGS="$ARGS --fail-on-breach"
          fi
          if [ "${CI_TREND_SLO_FAIL_ON_UNVERIFIED}" = "true" ]; then
            ARGS="$ARGS --fail-on-unverified"
          fi
          python tooling/evaluate_critical_ci_trend.py ${ARGS}

      - name: Publish critical CI trend artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-ci-trend-report
          path: |
            artifacts/critical_ci_trend_report.json
            artifacts/critical_ci_trend_slo_report.json

      - name: Append critical CI trend summary
        if: always()
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/critical_ci_trend_report.json')
          lines = ['## Critical CI Trend', '']
          if not path.exists():
              lines.append('- Report missing: artifacts/critical_ci_trend_report.json')
          else:
              report = json.loads(path.read_text(encoding='utf-8'))
              lines.append(f"- Status: {report.get('status', 'unknown')}")
              jobs = report.get('critical_jobs', {})
              for name in ['smoke', 'runtime_canary', 'dx_metrics', 'policy-bundle-governance']:
                  item = jobs.get(name, {}) if isinstance(jobs, dict) else {}
                  lines.append(
                      f"- {name}: {item.get('passed', 'n/a')}/{item.get('samples', 'n/a')} "
                      f"(pass_rate={item.get('pass_rate', 'n/a')})"
                  )

          slo_path = Path('artifacts/critical_ci_trend_slo_report.json')
          if not slo_path.exists():
              lines.append('- SLO report: missing')
          else:
              slo = json.loads(slo_path.read_text(encoding='utf-8'))
              lines.append(f"- SLO status: {slo.get('slo_status', 'unknown')}")
              for breach in slo.get('breaches', []):
                  lines.append(f"- SLO breach: {breach}")

          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY

  release_readiness_gate:
    needs:
      - pin_drift_guard
      - smoke
      - contracts
      - registry_consistency
      - openapi_verification
      - runtime_canary
      - dx_metrics
      - ci_stability_trend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_GATE_STRICT_MODE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
      NEEDS_CONTEXT_JSON: ${{ toJson(needs) }}

    steps:
      - name: Checkout agent-skills
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download smoke artifact
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: smoke-report
          path: artifacts

      - name: Download runtime canary artifact
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: runtime-canary-report
          path: artifacts

      - name: Download DX metrics artifact
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dx-metrics-report
          path: artifacts

      - name: Download critical CI trend artifact
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: critical-ci-trend-report
          path: artifacts

      - name: Download policy governance artifact
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: policy-bundle-governance-report
          path: artifacts

      - name: Evaluate consolidated release readiness gate
        if: always()
        run: |
          printf '%s' "${NEEDS_CONTEXT_JSON}" > artifacts/needs_context.json
          ARGS="--needs-json @artifacts/needs_context.json --artifacts-dir artifacts --report-file artifacts/release_readiness_gate_report.json --markdown-file artifacts/release_readiness_gate_summary.md --fail-on-no-go --policy-file .github/release_gate_policy.json"
          if [ -f .github/release_exceptions.json ]; then
            ARGS="$ARGS --exceptions-file .github/release_exceptions.json"
          fi
          if [ "${RELEASE_GATE_STRICT_MODE}" = "true" ]; then
            echo "Running release gate in strict mode (release branch push)."
            ARGS="$ARGS --policy-profile strict"
          else
            echo "Running release gate in non-strict mode (PR/dispatch/scheduled context)."
            ARGS="$ARGS --policy-profile transitional"
          fi
          python tooling/generate_release_readiness_gate.py ${ARGS}

      - name: Generate release lineage artifact
        if: always()
        run: |
          python tooling/generate_release_lineage.py --needs-json @artifacts/needs_context.json --artifacts-dir artifacts --report-file artifacts/release_lineage.json --markdown-file artifacts/release_lineage.md --fail-on-incomplete

      - name: Verify release lineage contract
        if: always()
        run: |
          python tooling/verify_release_lineage_contract.py --lineage-file artifacts/release_lineage.json --report-file artifacts/release_lineage_contract_report.json

      - name: Publish release readiness artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-gate-report
          path: |
            artifacts/release_readiness_gate_report.json
            artifacts/release_readiness_gate_summary.md
            artifacts/release_lineage.json
            artifacts/release_lineage.md
            artifacts/release_lineage_contract_report.json

      - name: Append release readiness summary
        if: always()
        run: |
          if [ -f artifacts/release_readiness_gate_summary.md ]; then
            cat artifacts/release_readiness_gate_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/release_lineage.md ]; then
            cat artifacts/release_lineage.md >> "$GITHUB_STEP_SUMMARY"
          fi
