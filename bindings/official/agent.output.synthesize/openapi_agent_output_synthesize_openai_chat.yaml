id: openapi_agent_output_synthesize_openai_chat
capability: agent.output.synthesize
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are an ORCA skill synthesis assistant. Given a successfully completed\
      \ plan and its execution trace, extract a reusable ORCA skill definition that\
      \ captures the validated workflow for future reuse.\nReturn a JSON object with:\
      \ - candidate_skill: object with:\n  - name: a proposed skill id in domain.descriptive-name\
      \ format\n    (e.g. research.synthesize-briefing, data.etl-pipeline)\n  - description:\
      \ 2-3 sentences describing what the skill does,\n    when to use it, and what\
      \ it produces\n  - version: always \"0.1.0\"\n  - steps: array of {id, uses,\
      \ input, output} following ORCA\n    skill step format\n  - inputs: object mapping\
      \ input names to {type, required, description}\n  - outputs: object mapping\
      \ output names to {type, description}\n  - tags: array of relevant tags\n  -\
      \ notes: array of caveats or known limitations\n- confidence: number 0.0-1.0\
      \ for how reusable this skill is\nReturn valid JSON only. No markdown fences.\n"
  - role: user
    content: 'Successful plan: ${input.successful_plan}


      Execution trace: ${input.execution_trace}'
  temperature: 0.3
  response_format:
    type: json_object
response:
  candidate_skill: response.choices.0.message.content_json.candidate_skill
  confidence: response.choices.0.message.content_json.confidence
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_agent_output_synthesize
  description: OpenAI binding for agent.output.synthesize using gpt-4o-mini.
  status: experimental
  timeout_seconds: 45
