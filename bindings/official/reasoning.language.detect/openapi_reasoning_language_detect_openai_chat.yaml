id: openapi_reasoning_language_detect_openai_chat
capability: reasoning.language.detect
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.language.detect. Capability description: Detect the language of text for routing and localization. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'text: ${input.text}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  language:
  - response.choices.0.message.content_json.language
  - response.choices.0.message.content_json.detected_language
  - response.choices.0.message.content_json.locale
  confidence:
  - response.choices.0.message.content_json.confidence
  - response.choices.0.message.content_json.confidence_score
  - response.choices.0.message.content_json.score
  status:
  - response.choices.0.message.content_json.status
  - response.choices.0.message.content_json.result
  trace_ref:
  - response.choices.0.message.content_json.trace_ref
  - response.choices.0.message.content_json.trace_id
  - response.id
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_language_detect
  description: OpenAI binding for reasoning.language.detect using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
