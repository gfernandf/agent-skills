id: openapi_decision_input_route_openai_chat
capability: decision.input.route
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for decision-input-route. Capability description: Route an incoming request to the most appropriate handler, agent, or capability based on the input content and available targets. Returns the selected route identifier and an optional confidence score.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'query: ${input.query}\n\nagents: ${input.agents}\n\nrouting_strategy: ${input.routing_strategy}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  route:
  - response.choices.0.message.content_json.route
  - response.choices.0.message.content_json.route_id
  - response.choices.0.message.content_json.selected_route
  confidence:
  - response.choices.0.message.content_json.confidence
  - response.choices.0.message.content_json.confidence_score
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_decision_input_route
  description: OpenAI binding for decision.input.route using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
