id: openapi_perception_input_structure_openai_chat
capability: perception.input.structure
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for perception.input.structure. Capability description: Structure available input into a normalized cognitive payload before downstream reasoning and evaluation.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'fields: ${input.fields}\n\ninstruction: ${input.instruction}\n\ncontext: ${input.context}\n\nraw_input: ${input.raw_input}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  structured_input: response.choices.0.message.content_json.structured_input
  complete: response.choices.0.message.content_json.complete
  missing_fields: response.choices.0.message.content_json.missing_fields
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_perception_input_structure
  description: OpenAI binding for perception.input.structure using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
