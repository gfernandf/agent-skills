id: openapi_evaluation_output_score_openai_chat
capability: evaluation.output.score
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.output.score. Capability description: Score the quality of an output artifact against an optional rubric. Evaluates coverage (completeness of fields), depth (structural complexity), and coherence. When a rubric is provided, scores each named dimension independently. Used as a quality gate in validation skills and research pipelines.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'output: ${input.output}\n\nrubric: ${input.rubric}\n\ncontext: ${input.context}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  score:
  - response.choices.0.message.content_json.score
  - response.choices.0.message.content_json.overall
  - response.choices.0.message.content_json.overall_score
  - response.choices.0.message.content_json.quality_score
  dimensions:
  - response.choices.0.message.content_json.dimensions
  - response.choices.0.message.content_json.dimension_scores
  - response.choices.0.message.content_json.scores
  quality_level:
  - response.choices.0.message.content_json.quality_level
  - response.choices.0.message.content_json.quality
  - response.choices.0.message.content_json.label
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_output_score
  description: OpenAI binding for eval.output.score using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
