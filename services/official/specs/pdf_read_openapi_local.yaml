openapi: 3.0.3
info:
  title: PDF Document Read Local API
  version: 1.0.0
  description: Local provider for pilot real-service integration of pdf.document.read.
servers:
  - url: http://127.0.0.1:8784
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /read:
    post:
      operationId: read
      summary: Extract text from PDF document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                pages:
                  type: array
                  items:
                    type: integer
      responses:
        '200':
          description: PDF extraction result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                  - status
                properties:
                  result:
                    type: object
                    properties:
                      text:
                        type: string
                      pages:
                        type: integer
                  status:
                    type: string
                    enum: [ok, partial, error]
                  trace_ref:
                    type: string
