id: openapi_evaluation_catalog_rank_openai_chat
capability: evaluation.catalog.rank
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.catalog.rank. Capability description: Rank candidate registry items by relevance to the interpreted goal. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'candidate_items: ${input.candidate_items}\n\ninterpreted_goal: ${input.interpreted_goal}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  ranked_skills:
  - response.choices.0.message.content_json.ranked_skills
  - response.choices.0.message.content_json.skills_ranked
  ranked_capabilities:
  - response.choices.0.message.content_json.ranked_capabilities
  - response.choices.0.message.content_json.capabilities_ranked
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_catalog_rank
  description: OpenAI binding for evaluation.catalog.rank using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
