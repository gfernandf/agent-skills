id: openapi_reasoning_sentiment_analyze_openai_chat
capability: reasoning.sentiment.analyze
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.sentiment.analyze. Capability description: Analyze the sentiment and emotional tone of text. Returns polarity classification, numeric score, and optional dimensional breakdown. For classifying text into custom categories use reasoning.content.classify.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'text: ${input.text}\n\ndimensions: ${input.dimensions}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  sentiment: response.choices.0.message.content_json.sentiment
  score: response.choices.0.message.content_json.score
  dimensions: response.choices.0.message.content_json.dimensions
  rationale: response.choices.0.message.content_json.rationale
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_sentiment_analyze
  description: OpenAI binding for reasoning.sentiment.analyze using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
