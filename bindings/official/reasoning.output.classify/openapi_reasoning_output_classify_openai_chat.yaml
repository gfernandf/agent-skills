id: openapi_reasoning_output_classify_openai_chat
capability: reasoning.output.classify
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.output.classify. Capability description: Classify a model-generated output into one of the provided categories based on its content and structure.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'output: ${input.output}\n\ncategories: ${input.categories}\n\ncontext: ${input.context}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  category: response.choices.0.message.content_json.category
  confidence: response.choices.0.message.content_json.confidence
  rationale: response.choices.0.message.content_json.rationale
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_output_classify
  description: OpenAI binding for reasoning.output.classify using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
