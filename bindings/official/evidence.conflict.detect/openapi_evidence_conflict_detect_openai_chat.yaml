id: openapi_evidence_conflict_detect_openai_chat
capability: evidence.conflict.detect
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evidence.conflict.detect. Capability description: Detect contradictions and tension between evidence items or claims.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'evidence_items: ${input.evidence_items}\n\nclaims: ${input.claims}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  conflicts: response.choices.0.message.content_json.conflicts
  conflict_severity: response.choices.0.message.content_json.conflict_severity
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evidence_conflict_detect
  description: OpenAI binding for evidence.conflict.detect using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
