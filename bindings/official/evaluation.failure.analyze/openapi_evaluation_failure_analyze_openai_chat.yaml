id: openapi_evaluation_failure_analyze_openai_chat
capability: evaluation.failure.analyze
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.failure.analyze. Capability description: Analyze failure events, classify root causes, and estimate recurrence risk.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'failure: ${input.failure}\n\ncontext: ${input.context}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  root_causes: response.choices.0.message.content_json.root_causes
  failure_class: response.choices.0.message.content_json.failure_class
  recurrence_risk: response.choices.0.message.content_json.recurrence_risk
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_failure_analyze
  description: OpenAI binding for evaluation.failure.analyze using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
