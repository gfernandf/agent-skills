id: openapi_agent_plan_map_openai_chat
capability: agent.plan.map
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a state wiring assistant for ORCA agent plans. Given a list\
      \ of expanded plan steps, replace every input and output placeholder with an\
      \ explicit $state.* path reference.\nState paths follow the pattern: $state.<namespace>.<field>\
      \ Use these namespaces:\n  - $state.intake.*     \u2014 data from the intake\
      \ node\n  - $state.goal.*       \u2014 interpreted goal and criteria\n  - $state.catalog.*\
      \    \u2014 registry search and rank results\n  - $state.plan.*       \u2014\
      \ plan objects and compiled DAG\n  - $state.working.*    \u2014 intermediate\
      \ results during execution\n  - $state.output.*     \u2014 final outputs and\
      \ report\n\nReturn a JSON object with: - bound_steps: same structure as expanded_steps\
      \ but with all input\n  and output values replaced by $state.* path strings\n\
      - unresolved_bindings: array of objects with step_id (string) and\n  field (string)\
      \ for any input that could not be assigned a path\n\nReturn valid JSON only.\
      \ No markdown fences.\n"
  - role: user
    content: 'Steps to wire: ${input.expanded_steps}


      State schema: ${input.state_schema}'
  temperature: 0.1
  response_format:
    type: json_object
response:
  bound_steps: response.choices.0.message.content_json.bound_steps
  unresolved_bindings: response.choices.0.message.content_json.unresolved_bindings
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_agent_plan_map
  description: OpenAI binding for agent.plan.map using gpt-4o-mini.
  status: experimental
  timeout_seconds: 45
