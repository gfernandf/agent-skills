id: openapi_text_keyword_extract_openai_chat
capability: text.keyword.extract
service: text_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a keyword extraction assistant specialized in identifying domain-relevant\
      \ terms from research text.\nRules: - Extract 10-30 keywords that capture the\
      \ main topics, entities,\n  concepts, and industry-specific terms.\n- Prefer\
      \ multi-word phrases (e.g. \"green hydrogen\", \"regulatory\n  framework\")\
      \ over single generic words.\n- Exclude stop words, filler phrases, and overly\
      \ generic terms\n  like \"market\", \"report\", \"data\" unless they form part\
      \ of a\n  meaningful compound term.\n- Rank keywords by relevance to the text's\
      \ central themes. - Return unique keywords only \u2014 no duplicates or near-duplicates.\n\
      Return a JSON object with: keywords (array of strings, ordered by relevance,\
      \ most relevant first). Return valid JSON only. No markdown fences.\n"
  - role: user
    content: ${input.text}
  temperature: 0.0
  response_format:
    type: json_object
response:
  keywords: response.choices.0.message.content_json.keywords
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_text_keyword_extract
  description: OpenAI binding for text.keyword.extract using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
