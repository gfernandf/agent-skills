id: openapi_reasoning_uncertainty_extract_openai_chat
capability: reasoning.uncertainty.extract
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.uncertainty.extract. Capability description: Extract explicit uncertainties, unknowns, and ambiguity points from a target artifact. Produces a structured uncertainty inventory and optional clarification questions for downstream planning.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'target: ${input.target}\n\ncontext: ${input.context}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  uncertainties: response.choices.0.message.content_json.uncertainties
  clarification_questions: response.choices.0.message.content_json.clarification_questions
  extraction_notes: response.choices.0.message.content_json.extraction_notes
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_uncertainty_extract
  description: OpenAI binding for reasoning.uncertainty.extract using gpt-4o-mini.
  status: deprecated
  timeout_seconds: 30
  deprecation_reason: capability_not_in_registry
  deprecation_source_of_truth: agent-skill-registry/capabilities
