id: openapi_evaluation_framework_detect_openai_chat
capability: evaluation.framework.detect
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.framework.detect. Capability description: Detect the most suitable evaluation framework for a given artifact, objective, and context.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'interpreted_goal: ${input.interpreted_goal}\n\ncandidate_items: ${input.candidate_items}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  missing_capabilities: response.choices.0.message.content_json.missing_capabilities
  missing_skills: response.choices.0.message.content_json.missing_skills
  gap_severity: response.choices.0.message.content_json.gap_severity
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_framework_detect
  description: OpenAI binding for evaluation.framework.detect using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
