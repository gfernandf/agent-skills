id: openapi_agent_goal_interpret_openai_chat
capability: agent.goal.interpret
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a goal interpretation assistant for an AI agent pipeline. Given\
      \ a structured user request, convert it into an explicit operational goal that\
      \ can be used to plan and execute work.\nReturn a JSON object with: - interpreted_goal:\
      \ object containing:\n  - objective: one clear sentence stating what must be\
      \ produced (string)\n  - deliverable_type: type of the expected output, e.g.\n\
      \    structured_briefing, analysis_report, code_artifact,\n    data_pipeline,\
      \ dashboard, answered_question (string)\n  - success_criteria: array of measurable\
      \ conditions that must be\n    met for the task to be considered successful\
      \ (min 2 items)\n  - constraints: array of explicit limitations from the user\
      \ request\n  - assumptions: array of things that must be true for this to work\n\
      \  - open_questions: array of ambiguities that could block planning\n- requires_clarification:\
      \ true if open_questions is non-empty\nBe explicit. Do not leave criteria vague.\
      \ Return valid JSON only.\n"
  - role: user
    content: 'Normalized request: ${input.normalized_request}


      Context: ${input.context}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  interpreted_goal: response.choices.0.message.content_json.interpreted_goal
  requires_clarification: response.choices.0.message.content_json.requires_clarification
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_agent_goal_interpret
  description: OpenAI binding for agent.goal.interpret using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
