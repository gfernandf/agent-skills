id: openapi_agent_request_normalize_openai_chat

capability: agent.request.normalize
service: model_openai_chat
protocol: openapi
operation: chat/completions

request:
  model: gpt-4o-mini
  messages:
    - role: system
      content: >
        You are an intake normalization assistant. Given a raw user message and
        optional session context, extract a structured request object.

        Return a JSON object with:
        - normalized_request: object containing:
          - raw_request: the original user message (string)
          - language: ISO 639-1 code detected from the message (string)
          - detected_intent: short label for the primary intent, e.g.
            research_and_synthesize, create_document, analyze_data,
            execute_task, answer_question (string)
          - explicit_constraints: array of constraints stated by the user
            (e.g. "in Spanish", "max 2 pages")
          - urgency: one of low | medium | high
          - requires_external_action: true if the request implies writing
            files, sending emails, calling APIs, or modifying systems
          - attachments: array of attachment descriptions if any
        - language: same ISO code as normalized_request.language

        Be conservative with urgency: default to medium unless explicitly
        stated. Return valid JSON only. No markdown fences.
    - role: user
      content: "User message: ${input.user_message}\n\nContext: ${input.context}"
  temperature: 0.1
  response_format:
    type: json_object

response:
  normalized_request: response.choices.0.message.content_json.normalized_request
  language: response.choices.0.message.content_json.language

metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_agent_request_normalize
  description: "OpenAI binding for agent.request.normalize using gpt-4o-mini."
  status: experimental
