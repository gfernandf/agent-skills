id: openapi_reasoning_constraint_reconcile_openai_chat
capability: reasoning.constraint.reconcile
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.constraint.reconcile. Capability description: Reconcile conflicting constraints and produce a coherent constraint set with trade-offs.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'constraints: ${input.constraints}\n\npolicy: ${input.policy}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  reconciled_constraints: response.choices.0.message.content_json.reconciled_constraints
  tradeoffs: response.choices.0.message.content_json.tradeoffs
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_constraint_reconcile
  description: OpenAI binding for reasoning.constraint.reconcile using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
