id: openapi_reasoning_risk_extract_openai_chat
capability: reasoning.risk.extract
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.risk.extract. Capability description: Extract risks, fragile assumptions, failure modes, and preliminary mitigation ideas from a target artifact (decision, plan, analysis, proposal, draft). Produces a structured risk inventory with severity hints. Does NOT score or rank risks — that is the responsibility of downstream capabilities.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'target: ${input.target}\n\ncontext: ${input.context}\n\nrisk_scope: ${input.risk_scope}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  risks: response.choices.0.message.content_json.risks
  assumptions: response.choices.0.message.content_json.assumptions
  failure_modes: response.choices.0.message.content_json.failure_modes
  mitigation_ideas: response.choices.0.message.content_json.mitigation_ideas
  extraction_notes: response.choices.0.message.content_json.extraction_notes
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_risk_extract
  description: OpenAI binding for reasoning.risk.extract using gpt-4o-mini.
  status: experimental
  timeout_seconds: 60
  retry_count: 15
