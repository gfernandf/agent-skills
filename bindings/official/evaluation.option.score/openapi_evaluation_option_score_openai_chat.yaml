id: openapi_evaluation_option_score_openai_chat
capability: evaluation.option.score
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.option.score. Capability description: Evaluate a set of options against weighted criteria and produce a comparative scoring. Each option is scored per-criterion and overall. Returns the ranked list, a comparative summary, and explicit trade-offs between top candidates. Designed for multi-criteria decision analysis where transparency of evaluation matters more than speed.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'options: ${input.options}\n\ncriteria: ${input.criteria}\n\ngoal: ${input.goal}\n\nrisk_tolerance: ${input.risk_tolerance}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  scored_options: response.choices.0.message.content_json.scored_options
  criteria_used:
  - response.choices.0.message.content_json.criteria_used
  - response.choices.0.message.content_json.criteria
  - response.choices.0.message.content_json.applied_criteria
  comparative_summary:
  - response.choices.0.message.content_json.comparative_summary
  - response.choices.0.message.content_json.summary
  - response.choices.0.message.content_json.rationale
  tradeoffs:
  - response.choices.0.message.content_json.tradeoffs
  - response.choices.0.message.content_json.trade_offs
  - response.choices.0.message.content_json.option_tradeoffs
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_option_score
  description: OpenAI binding for evaluation.option.score using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30


