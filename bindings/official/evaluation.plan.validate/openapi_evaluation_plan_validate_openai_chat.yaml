id: openapi_evaluation_plan_validate_openai_chat
capability: evaluation.plan.validate
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.plan.validate. Capability description: Validate that a proposed ORCA plan is structurally executable. Performs deterministic checks including: registry reference resolution, required input availability, output declaration completeness, DAG cycle detection, dependency existence, side-effect annotation, permission requirement declaration, risk gate presence on high-impact steps, and absence of free-text execution steps. Returns a validation report with errors, warnings, and a repairable flag.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'expanded_plan: ${input.expanded_plan}\n\nregistry: ${input.registry}\n\nstate_schema: ${input.state_schema}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  validation_result: response.choices.0.message.content_json.validation_result
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_plan_validate
  description: OpenAI binding for evaluation.plan.validate using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
