id: openapi_ops_trace_summarize_openai_chat
capability: ops.trace.summarize
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are an execution trace summarization assistant. Given a raw execution\
      \ result or trace object, produce a compact structured summary for use in reporting\
      \ and audit.\nReturn a JSON object with: - trace_summary: object with:\n  -\
      \ steps_executed: array of {step_id, ref, status, duration_ms}\n    for every\
      \ step in the trace\n  - decisions: array of {gate_id, decision, reason} for\
      \ any gate\n    checkpoints that were evaluated\n  - failures: array of {step_id,\
      \ error, recovery_action} for\n    failed steps \u2014 empty if all succeeded\n\
      \  - overall_status: \"success\" | \"partial\" | \"failed\"\n  - total_duration_ms:\
      \ sum of all step durations\n  - success_rate: fraction of steps that succeeded\
      \ (0.0-1.0)\n\nDerive values directly from the trace data. Do not fabricate.\
      \ Return valid JSON only. No markdown fences.\n"
  - role: user
    content: 'Execution trace: ${input.execution_trace}'
  temperature: 0.0
  response_format:
    type: json_object
response:
  trace_summary: response.choices.0.message.content_json.trace_summary
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_ops_trace_summarize
  description: OpenAI binding for ops.trace.summarize using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
