id: openapi_evaluation_hypothesis_compare_openai_chat
capability: evaluation.hypothesis.compare
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.hypothesis.compare. Capability description: Compare evaluated hypotheses and surface trade-offs, ranking, and a recommended lead hypothesis. Designed for transparent hypothesis selection under competing evidence and uncertainty.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'evaluated_hypotheses: ${input.evaluated_hypotheses}\n\ncomparison_axes: ${input.comparison_axes}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  ranked_hypotheses:
  - response.choices.0.message.content_json.ranked_hypotheses
  - response.choices.0.message.content_json.hypotheses_ranked
  - response.choices.0.message.content_json.ranked
  tradeoffs:
  - response.choices.0.message.content_json.tradeoffs
  - response.choices.0.message.content_json.trade_offs
  - response.choices.0.message.content_json.comparisons
  recommendation:
  - response.choices.0.message.content_json.recommendation
  - response.choices.0.message.content_json.recommended_hypothesis
  - response.choices.0.message.content_json.lead_hypothesis
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_hypothesis_compare
  description: OpenAI binding for evaluation.hypothesis.compare using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
