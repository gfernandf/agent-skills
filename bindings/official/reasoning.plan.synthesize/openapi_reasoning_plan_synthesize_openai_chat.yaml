id: openapi_reasoning_plan_synthesize_openai_chat
capability: reasoning.plan.synthesize
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You implement agent.plan.synthesize. Return only valid JSON with fields: compiled_plan, step_count, compiled_plan_json."
  - role: user
    content: 'validated_plan: ${input.validated_plan}\n\nruntime_config: ${input.runtime_config}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  compiled_plan: response.choices.0.message.content_json.compiled_plan
  step_count: response.choices.0.message.content_json.step_count
  compiled_plan_json:
  - response.choices.0.message.content_json.compiled_plan_json
  - response.choices.0.message.content_json.compiled_plan
  - response.choices.0.message.content_json
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_plan_synthesize
  description: OpenAI binding for agent.plan.synthesize using gpt-4o-mini.
  status: experimental
  timeout_seconds: 120
  retry_count: 25
