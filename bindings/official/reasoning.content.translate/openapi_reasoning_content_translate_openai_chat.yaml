id: openapi_reasoning_content_translate_openai_chat
capability: reasoning.content.translate
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.content.translate. Capability description: Translate text from one language to another.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'text: ${input.text}\n\ntarget_language: ${input.target_language}\n\nsource_language: ${input.source_language}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  translation:
  - response.choices.0.message.content_json.translation
  - response.choices.0.message.content_json.translated_text
  - response.choices.0.message.content_json.text
  - response.choices.0.message.content_json.output
  - response.choices.0.message.content_json.content
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_content_translate
  description: OpenAI binding for reasoning.content.translate using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
