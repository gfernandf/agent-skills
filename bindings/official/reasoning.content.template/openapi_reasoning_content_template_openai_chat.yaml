id: openapi_reasoning_content_template_openai_chat
capability: reasoning.content.template
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.content.template. Capability description: Render a text template using variables.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'template: ${input.template}\n\nvariables: ${input.variables}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  text: response.choices.0.message.content_json.text
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_content_template
  description: OpenAI binding for reasoning.content.template using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
