openapi: 3.0.3
info:
  title: Web Page Fetch Local API
  version: 1.0.0
  description: Local provider for pilot real-service integration of web.page.fetch.
servers:
  - url: http://127.0.0.1:8783
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, error]
  /fetch:
    post:
      operationId: fetch
      summary: Fetch web page content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: URL to fetch
                timeout:
                  type: integer
                  description: Request timeout in seconds
                headers:
                  type: object
                  description: Optional HTTP headers
      responses:
        '200':
          description: Fetch result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                  - status
                properties:
                  result:
                    type: object
                    properties:
                      content:
                        type: string
                      status_code:
                        type: integer
                      headers:
                        type: object
                  status:
                    type: string
                    enum: [ok, partial, error]
                  trace_ref:
                    type: string
