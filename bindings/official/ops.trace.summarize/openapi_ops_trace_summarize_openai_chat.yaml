id: openapi_ops_trace_summarize_openai_chat

capability: ops.trace.summarize
service: model_openai_chat
protocol: openapi
operation: chat/completions

request:
  model: gpt-4o-mini
  messages:
    - role: system
      content: >
        You are an execution trace summarization assistant. Given a raw
        execution result or trace object, produce a compact structured
        summary for use in reporting and audit.

        Return a JSON object with:
        - trace_summary: object with:
          - steps_executed: array of {step_id, ref, status, duration_ms}
            for every step in the trace
          - decisions: array of {gate_id, decision, reason} for any gate
            checkpoints that were evaluated
          - failures: array of {step_id, error, recovery_action} for
            failed steps — empty if all succeeded
          - overall_status: "success" | "partial" | "failed"
          - total_duration_ms: sum of all step durations
          - success_rate: fraction of steps that succeeded (0.0-1.0)

        Derive values directly from the trace data. Do not fabricate.
        Return valid JSON only. No markdown fences.
    - role: user
      content: "Execution trace: ${input.execution_trace}"
  temperature: 0.0
  response_format:
    type: json_object

response:
  trace_summary: response.choices.0.message.content_json.trace_summary

metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_ops_trace_summarize
  description: "OpenAI binding for ops.trace.summarize using gpt-4o-mini."
  status: experimental
