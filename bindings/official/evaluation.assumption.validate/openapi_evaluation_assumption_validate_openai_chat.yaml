id: openapi_evaluation_assumption_validate_openai_chat
capability: evaluation.assumption.validate
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for evaluation.assumption.validate. Capability description: Validate assumptions for plausibility, consistency, and evidentiary support.. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'assumptions: ${input.assumptions}\n\nevidence: ${input.evidence}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  validated_assumptions:
  - response.choices.0.message.content_json.validated_assumptions
  - response.choices.0.message.content_json.assumptions
  - response.choices.0.message.content_json.validation_results
  confidence_summary:
  - response.choices.0.message.content_json.confidence_summary
  - response.choices.0.message.content_json.summary
  - response.choices.0.message.content_json.rationale
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_evaluation_assumption_validate
  description: OpenAI binding for evaluation.assumption.validate using gpt-4o-mini.
  status: deprecated
  timeout_seconds: 30
  deprecation_reason: capability_not_in_registry
  deprecation_source_of_truth: agent-skill-registry/capabilities
