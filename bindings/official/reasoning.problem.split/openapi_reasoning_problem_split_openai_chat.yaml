id: openapi_reasoning_problem_split_openai_chat
capability: reasoning.problem.split
service: model_openai_chat
protocol: openapi
operation: chat/completions
request:
  model: gpt-4o-mini
  messages:
  - role: system
    content: "You are a capability implementation engine for reasoning.problem.split. Capability description: Split a complex problem into manageable, described components with dependencies. Return a valid JSON object only (no markdown). Include all expected output fields exactly as requested by this capability contract."
  - role: user
    content: 'problem: ${input.problem}\n\nstrategy: ${input.strategy}\n\ncontext: ${input.context}\n\nmax_components: ${input.max_components}'
  temperature: 0.2
  response_format:
    type: json_object
response:
  components:
  - response.choices.0.message.content_json.components
  - response.choices.0.message.content_json.subproblems
  - response.choices.0.message.content_json.items
  - response.choices.0.message.content_json
  gaps: response.choices.0.message.content_json.gaps
  overlaps: response.choices.0.message.content_json.overlaps
  decomposition_notes: response.choices.0.message.content_json.decomposition_notes
  status:
  - response.choices.0.message.content_json.status
  - response.choices.0.message.content_json.result
  trace_ref:
  - response.choices.0.message.content_json.trace_ref
  - response.choices.0.message.content_json.trace_id
  - response.id
metadata:
  method: POST
  response_mode: json
  fallback_binding_id: python_reasoning_problem_split
  description: OpenAI binding for reasoning.problem.split using gpt-4o-mini.
  status: experimental
  timeout_seconds: 30
  retry_count: 10
